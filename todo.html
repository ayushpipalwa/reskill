<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>To‑Do List</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Small page-specific tweaks so todo.html looks fine with existing style.css */
    .todo-container {
      max-width: 720px;
      margin: 2.5rem auto;
      padding: 1.25rem;
    }

    .todo-controls {
      display:flex;
      gap:0.5rem;
      margin-bottom:1rem;
      align-items:center;
    }

    #new-task-input {
      flex:1;
      padding:0.6rem 0.75rem;
      border-radius:6px;
      border:1px solid var(--border);
      font-size:0.95rem;
    }

    .task-list {
      list-style:none;
      margin-top:1rem;
      padding:0;
      display:flex;
      flex-direction:column;
      gap:0.5rem;
    }

    .task-item {
      display:flex;
      align-items:center;
      gap:0.75rem;
      padding:0.65rem;
      border-radius:8px;
      border:1px solid var(--border);
      background: #fff;
    }

    .task-item.completed .task-text {
      text-decoration:line-through;
      color:var(--muted);
    }

    .task-text {
      flex:1;
      font-size:0.95rem;
      word-break:break-word;
    }

    .task-actions button {
      background:transparent;
      border:0;
      color:var(--muted);
      cursor:pointer;
      font-size:0.95rem;
      padding:0.35rem 0.5rem;
      border-radius:6px;
    }

    .task-actions button:hover { background: rgba(11,94,215,0.04); color:var(--primary); }

    .filters { display:flex; gap:0.5rem; }

    .filters button.active { background:var(--primary); color:#fff; border-color:var(--primary); }

    .edit-input {
      width:100%;
      padding:0.4rem 0.5rem;
      border-radius:6px;
      border:1px solid var(--border);
      font-size:0.95rem;
    }

    @media (max-width:600px) {
      .todo-container { margin:1.25rem; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">Instant Professionals</div>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="pricing.html">Pricing</a>
    <a href="contact.html">Contact</a>
    <a href="todo.html">To‑Do</a>
  </nav>
</header>

<main class="todo-container">
  <section class="page-header">
    <h1>To‑Do List</h1>
    <p style="color:var(--muted); margin-top:0.5rem;">Simple to‑do app — tasks are saved in your browser (localStorage).</p>
  </section>

  <div class="todo-controls">
    <input id="new-task-input" type="text" placeholder="Add a new task and press Enter" aria-label="New task">
    <button id="add-btn" class="btn-primary">Add</button>
    <button id="clear-completed" class="btn-secondary">Clear completed</button>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; gap:1rem;">
    <div class="filters" role="tablist" aria-label="Task filters">
      <button class="btn-secondary filter-btn active" data-filter="all">All</button>
      <button class="btn-secondary filter-btn" data-filter="active">Active</button>
      <button class="btn-secondary filter-btn" data-filter="completed">Completed</button>
    </div>
    <div style="color:var(--muted); font-size:0.95rem;" id="remaining-count">0 items left</div>
  </div>

  <ul id="task-list" class="task-list" aria-live="polite"></ul>

  <p style="color:var(--muted); margin-top:1rem; font-size:0.9rem;">Notes: Tasks persist in your browser. Clearing site data or using a private window may remove them.</p>
</main>

<footer class="footer">
  <p>© <span id="year"></span> Instant Professionals.</p>
</footer>

<script src="todo.js"></script>
</body>
</html>
